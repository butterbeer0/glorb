<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glorb Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9e4f5; --ink:#2a1b4d; --card:#fff; --accent:#ff7a1a; --mint:#7ee0b5; --muted:#6b5f8a;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#1c1236; --ink:#f1ecff; --card:#2a1b4d; --muted:#b3a6d6}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:48px 20px 80px}
  h1{font-size:clamp(3rem,12vw,7rem);font-weight:800;line-height:.9;letter-spacing:-.04em;margin:0 0 12px}
  h1 span{display:inline-block;width:.7em;height:.7em;background:var(--mint);border-radius:50%;margin-left:.08em;vertical-align:baseline;transform:translateY(.05em)}
  .sub{color:var(--muted);font-size:1.15rem;margin:0 0 32px}
  input{width:100%;max-width:420px;padding:12px 16px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:999px;margin-bottom:32px}
  input:focus-visible,a.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
  a.card{display:flex;flex-direction:column;background:var(--card);color:inherit;text-decoration:none;border:2px solid var(--ink);border-radius:20px;overflow:hidden;transition:transform .12s}
  a.card:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--accent)}
  .thumb{aspect-ratio:16/10;display:grid;place-items:center;background:var(--mint);font-size:3.5rem;border-bottom:2px solid var(--ink)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .body{padding:14px 16px 18px}
  .body h2{margin:0 0 4px;font-size:1.25rem}
  .body p{margin:0;color:var(--muted);font-size:.95rem}
  .msg{color:var(--muted);padding:24px 0}
  code{background:var(--card);padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<main class="wrap">
  <h1>glorb<span></span></h1>
  <p class="sub">Pick a game and play.</p>
  <input id="q" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
  <div id="grid" class="grid"></div>
  <p id="msg" class="msg" hidden></p>
</main>
<script>
(async () => {
  const grid = document.getElementById('grid'), msg = document.getElementById('msg'), q = document.getElementById('q');
  let games = [];
  try {
    const res = await fetch('games/games.json', {cache:'no-cache'});
    if (!res.ok) throw new Error(res.status);
    games = await res.json();
  } catch (e) {
    msg.hidden = false;
    msg.innerHTML = 'Couldn’t load <code>games/games.json</code>. If you opened this file directly, run a local server (<code>python3 -m http.server</code>) or use GitHub Pages.';
    return;
  }
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function render() {
    const t = q.value.trim().toLowerCase();
    const list = games.filter(g => (g.title + ' ' + (g.description||'')).toLowerCase().includes(t));
    grid.innerHTML = list.map(g => {
      const base = 'games/' + encodeURIComponent(g.folder) + '/';
      const thumb = g.thumbnail
        ? `<img src="${base}${esc(g.thumbnail)}" alt="">`
        : esc(g.emoji || '🎮');
      return `<a class="card" href="${base}index.html">
        <div class="thumb">${thumb}</div>
        <div class="body"><h2>${esc(g.title)}</h2><p>${esc(g.description)}</p></div></a>`;
    }).join('');
    msg.hidden = list.length > 0;
    if (!list.length) msg.textContent = games.length ? 'No games match that search.' : 'No games yet. Add one to games/games.json.';
  }
  q.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
